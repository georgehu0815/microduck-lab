<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-label="MicroDuck arm v1-C wiring architecture concept">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#027a48"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", sans-serif; fill: #182230; }
      .title { font-size: 25px; font-weight: 700; }
      .warn { font-size: 15px; font-weight: 700; fill: #b42318; }
      .label { font-size: 14px; font-weight: 700; }
      .small { font-size: 12px; }
      .tiny { font-size: 10px; }
      .box { fill: #eef2f6; stroke: #344054; stroke-width: 2; }
      .study { fill: #fff4cc; stroke: #b54708; stroke-width: 2; }
      .blocked { fill: #fee4e2; stroke: #b42318; stroke-width: 2; }
      .power { fill: none; stroke: #b42318; stroke-width: 4; marker-end: url(#arrowRed); }
      .ground { fill: none; stroke: #344054; stroke-width: 3; }
      .data { fill: none; stroke: #027a48; stroke-width: 3; marker-end: url(#arrowGreen); }
      .dashed { stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1100" height="850" fill="#ffffff"/>
  <text class="title" x="32" y="40">MicroDuck arm v1-C - power and data architecture / 电源与数据架构</text>
  <text class="warn" x="32" y="66">CONCEPT ONLY - NO QUALIFIED PACK, REGULATOR, PROTECTION OR MOBILE CONTROLLER</text>
  <text class="small" x="32" y="88">Default bench source is external regulated 5 V. Shared-pack and separate-pack paths are mutually exclusive studies.</text>

  <rect class="box" x="35" y="130" width="225" height="110"/>
  <text class="label" x="147" y="160" text-anchor="middle">DEFAULT BENCH SOURCE</text>
  <text class="small" x="147" y="184" text-anchor="middle">external regulated 5 V</text>
  <text class="small" x="147" y="207" text-anchor="middle">current-limited and enclosed</text>
  <text class="small" x="147" y="228" text-anchor="middle">exact model/rating TBD</text>

  <rect class="study" x="35" y="280" width="225" height="135"/>
  <text class="label" x="147" y="310" text-anchor="middle">SHARED ROBOT PACK STUDY</text>
  <text class="small" x="147" y="334" text-anchor="middle">pack range/transients unknown</text>
  <text class="small" x="147" y="356" text-anchor="middle">independently protected regulator</text>
  <text class="small" x="147" y="378" text-anchor="middle">buck-boost may be required</text>
  <text class="small" x="147" y="400" text-anchor="middle">not approved</text>

  <rect class="study" x="35" y="455" width="225" height="145"/>
  <text class="label" x="147" y="485" text-anchor="middle">SEPARATE ARM PACK STUDY</text>
  <text class="small" x="147" y="509" text-anchor="middle">qualified pack unknown</text>
  <text class="small" x="147" y="531" text-anchor="middle">BMS + charger required</text>
  <text class="small" x="147" y="553" text-anchor="middle">converter may still be required</text>
  <text class="small" x="147" y="575" text-anchor="middle">not approved</text>

  <rect class="study" x="325" y="260" width="150" height="100"/>
  <text class="label" x="400" y="289" text-anchor="middle">SOURCE SELECT</text>
  <text class="small" x="400" y="313" text-anchor="middle">one topology only</text>
  <text class="small" x="400" y="335" text-anchor="middle">interlock TBD</text>

  <path class="power" d="M260 185 L310 185 L310 285 L325 285"/>
  <path class="power dashed" d="M260 347 L325 310"/>
  <path class="power dashed" d="M260 527 L310 527 L310 335 L325 335"/>

  <rect class="study" x="520" y="145" width="130" height="70"/>
  <text class="label" x="585" y="172" text-anchor="middle">F_MAIN</text>
  <text class="small" x="585" y="195" text-anchor="middle">PN/rating TBD</text>
  <rect class="study" x="520" y="255" width="130" height="80"/>
  <text class="label" x="585" y="283" text-anchor="middle">DC DISCONNECT</text>
  <text class="small" x="585" y="307" text-anchor="middle">PN/rating TBD</text>
  <rect class="study" x="520" y="375" width="130" height="92"/>
  <text class="label" x="585" y="403" text-anchor="middle">5 V CONDITIONING</text>
  <text class="small" x="585" y="427" text-anchor="middle">regulator/filter TBD</text>
  <text class="small" x="585" y="449" text-anchor="middle">reverse-current TBD</text>
  <rect class="study" x="520" y="510" width="130" height="82"/>
  <text class="label" x="585" y="538" text-anchor="middle">5 BRANCHES</text>
  <text class="small" x="585" y="562" text-anchor="middle">F1-F5 TBD</text>
  <text class="small" x="585" y="582" text-anchor="middle">harness TBD</text>

  <path class="power" d="M475 310 L500 310 L500 180 L520 180"/>
  <path class="power" d="M585 215 L585 255"/>
  <path class="power" d="M585 335 L585 375"/>
  <path class="power" d="M585 467 L585 510"/>

  <rect class="box" x="735" y="115" width="320" height="390"/>
  <text class="label" x="895" y="145" text-anchor="middle">ARM ACTUATOR DOMAIN / 手臂执行器域</text>
  <g transform="translate(765,170)">
    <rect class="box" x="0" y="0" width="250" height="48"/>
    <text class="small" x="16" y="29">M1 J1 base yaw | provisional ID 21</text>
    <rect class="box" x="0" y="62" width="250" height="48"/>
    <text class="small" x="16" y="91">M2 J2 shoulder | provisional ID 22</text>
    <rect class="box" x="0" y="124" width="250" height="48"/>
    <text class="small" x="16" y="153">M3 J3 elbow | provisional ID 23</text>
    <rect class="box" x="0" y="186" width="250" height="48"/>
    <text class="small" x="16" y="215">M4 J4 wrist | provisional ID 24</text>
    <rect class="box" x="0" y="248" width="250" height="48"/>
    <text class="small" x="16" y="277">M5 J5 gripper | provisional ID 25</text>
  </g>
  <path class="power" d="M650 551 L700 551 L700 190 L735 190"/>
  <line class="ground" x1="650" y1="575" x2="710" y2="575"/>
  <line class="ground" x1="710" y1="575" x2="710" y2="475"/>
  <line class="ground" x1="710" y1="475" x2="735" y2="475"/>

  <rect class="box" x="325" y="640" width="180" height="92"/>
  <text class="label" x="415" y="669" text-anchor="middle">BENCH HOST + TTL</text>
  <text class="small" x="415" y="693" text-anchor="middle">U2D2/equivalent study</text>
  <text class="small" x="415" y="715" text-anchor="middle">USB VBUS no-connect</text>
  <rect class="blocked" x="35" y="650" width="225" height="72"/>
  <text class="label" x="147" y="678" text-anchor="middle">MOBILE CONTROLLER</text>
  <text class="small" x="147" y="704" text-anchor="middle">NO APPROVED CANDIDATE</text>
  <rect class="study" x="555" y="650" width="180" height="92"/>
  <text class="small" x="645" y="679" text-anchor="middle">WATCHDOG + HEARTBEAT</text>
  <text class="small" x="645" y="703" text-anchor="middle">independent functions</text>
  <text class="small" x="645" y="724" text-anchor="middle">physical validation TBD</text>
  <path class="data" d="M505 685 L555 685"/>
  <path class="data" d="M735 685 L750 685 L750 470 L765 470"/>

  <rect class="blocked" x="775" y="630" width="280" height="135"/>
  <text class="label" x="795" y="660">PROHIBITED / 禁止</text>
  <text class="small" x="795" y="686">No short-circuit testing on the robot.</text>
  <text class="small" x="795" y="708">No reverse polarity or reverse powering.</text>
  <text class="tiny" x="795" y="730">No arm VDD to robot battery+, body VDD or USB VBUS.</text>
  <text class="tiny" x="795" y="752">No body DATA connection without approved architecture.</text>

  <text class="tiny" x="32" y="820">Logical architecture only. Wire gauge, connectors, fuses, switch, regulator, grounding, EMC, regenerative paths and fault ratings are unreleased.</text>
</svg>
