<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-label="MicroDuck arm v1-C load path concept">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", sans-serif; fill: #182230; }
      .title { font-size: 25px; font-weight: 700; }
      .warn { font-size: 15px; font-weight: 700; fill: #b42318; }
      .label { font-size: 14px; font-weight: 700; }
      .small { font-size: 12px; }
      .tiny { font-size: 10px; }
      .structure { fill: #d7e3ea; stroke: #344054; stroke-width: 2; }
      .bearing { fill: #ffffff; stroke: #175cd3; stroke-width: 3; }
      .shaft { stroke: #175cd3; stroke-width: 8; }
      .motor { fill: #e9d7fe; stroke: #6941c6; stroke-width: 2; }
      .tbd { fill: #fff4cc; stroke: #b54708; stroke-width: 2; }
      .load { fill: none; stroke: #b42318; stroke-width: 4; marker-end: url(#arrow); }
      .reaction { fill: none; stroke: #027a48; stroke-width: 3; marker-end: url(#arrow); }
      .boundary { fill: none; stroke: #667085; stroke-width: 2; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1100" height="900" fill="#ffffff"/>
  <text class="title" x="32" y="40">MicroDuck arm v1-C - structural load path / 承力路径</text>
  <text class="warn" x="32" y="66">CONCEPT REVIEW ONLY - NOT FABRICATION READY / 仅供概念评审，不可用于加工</text>
  <text class="small" x="32" y="88">Bearings, shafts, horns, spacers, retainers, fasteners, materials, fits and part numbers are TBD.</text>

  <rect class="boundary" x="25" y="110" width="1050" height="505"/>
  <text class="small" x="42" y="135">Required physical load path; motor output bearings are not assumed to be the sole structural supports.</text>

  <rect class="tbd" x="45" y="250" width="115" height="125"/>
  <text class="label" x="102" y="278" text-anchor="middle">TRUNK</text>
  <text class="small" x="102" y="300" text-anchor="middle">interface</text>
  <text class="small" x="102" y="322" text-anchor="middle">datums / PN</text>
  <text class="small" x="102" y="344" text-anchor="middle">TBD</text>

  <g transform="translate(195,312)">
    <rect class="structure" x="-25" y="-66" width="50" height="132"/>
    <line class="shaft" x1="-7" y1="-50" x2="-7" y2="50"/>
    <circle class="bearing" cx="-7" cy="-38" r="10"/>
    <circle class="bearing" cx="-7" cy="38" r="10"/>
    <rect class="motor" x="24" y="-32" width="64" height="64"/>
    <text class="label" x="56" y="-5" text-anchor="middle">M1</text>
    <text class="tiny" x="56" y="14" text-anchor="middle">horn TBD</text>
    <text class="small" x="-5" y="88" text-anchor="middle">J1 shaft + 2 bearings</text>
  </g>

  <line class="structure" x1="225" y1="312" x2="330" y2="312" stroke-width="26"/>

  <g transform="translate(355,312)">
    <rect class="structure" x="-22" y="-62" width="44" height="124"/>
    <line class="shaft" x1="0" y1="-46" x2="0" y2="46"/>
    <circle class="bearing" cx="0" cy="-34" r="10"/>
    <circle class="bearing" cx="0" cy="34" r="10"/>
    <rect class="motor" x="-76" y="-30" width="54" height="60"/>
    <text class="label" x="-49" y="-4" text-anchor="middle">M2</text>
    <text class="tiny" x="-49" y="14" text-anchor="middle">horn TBD</text>
    <text class="small" x="0" y="86" text-anchor="middle">J2 shoulder support</text>
  </g>

  <line class="structure" x1="377" y1="312" x2="545" y2="270" stroke-width="20"/>
  <text class="small" x="455" y="270" text-anchor="middle">upper link / 55 mm axes</text>

  <g transform="translate(570,264)">
    <rect class="structure" x="-20" y="-55" width="40" height="110"/>
    <line class="shaft" x1="0" y1="-42" x2="0" y2="42"/>
    <circle class="bearing" cx="0" cy="-30" r="9"/>
    <circle class="bearing" cx="0" cy="30" r="9"/>
    <rect class="motor" x="-68" y="60" width="56" height="58"/>
    <text class="label" x="-40" y="86" text-anchor="middle">M3</text>
    <text class="tiny" x="-40" y="104" text-anchor="middle">horn TBD</text>
    <text class="small" x="0" y="-72" text-anchor="middle">J3 elbow support</text>
  </g>

  <line class="structure" x1="590" y1="264" x2="740" y2="302" stroke-width="18"/>
  <text class="small" x="667" y="270" text-anchor="middle">forearm / 50 mm axes</text>

  <g transform="translate(765,307)">
    <rect class="structure" x="-20" y="-54" width="40" height="108"/>
    <line class="shaft" x1="0" y1="-40" x2="0" y2="40"/>
    <circle class="bearing" cx="0" cy="-28" r="9"/>
    <circle class="bearing" cx="0" cy="28" r="9"/>
    <rect class="motor" x="-28" y="-116" width="56" height="58"/>
    <text class="label" x="0" y="-90" text-anchor="middle">M4</text>
    <text class="tiny" x="0" y="-72" text-anchor="middle">horn TBD</text>
    <text class="small" x="0" y="78" text-anchor="middle">independent J4 wrist shaft</text>
  </g>

  <rect class="structure" x="787" y="272" width="88" height="70"/>
  <text class="small" x="831" y="298" text-anchor="middle">gripper</text>
  <text class="small" x="831" y="317" text-anchor="middle">housing</text>
  <text class="tiny" x="831" y="334" text-anchor="middle">separate from J4</text>
  <rect class="motor" x="804" y="365" width="55" height="58"/>
  <text class="label" x="831" y="391" text-anchor="middle">M5</text>
  <text class="tiny" x="831" y="409" text-anchor="middle">coupler TBD</text>

  <line class="shaft" x1="902" y1="260" x2="902" y2="360"/>
  <line class="shaft" x1="950" y1="260" x2="950" y2="360"/>
  <circle class="bearing" cx="902" cy="276" r="8"/>
  <circle class="bearing" cx="902" cy="344" r="8"/>
  <circle class="bearing" cx="950" cy="276" r="8"/>
  <circle class="bearing" cx="950" cy="344" r="8"/>
  <circle class="tbd" cx="902" cy="310" r="24"/>
  <circle class="tbd" cx="950" cy="310" r="24"/>
  <text class="tiny" x="926" y="237" text-anchor="middle">jaw shafts + bearings</text>
  <text class="tiny" x="926" y="313" text-anchor="middle">m1 z24</text>
  <line class="structure" x1="902" y1="360" x2="930" y2="450" stroke-width="14"/>
  <line class="structure" x1="950" y1="360" x2="922" y2="450" stroke-width="14"/>
  <rect class="tbd" x="906" y="440" width="24" height="8"/>
  <rect class="tbd" x="922" y="440" width="24" height="8"/>
  <text class="tiny" x="926" y="475" text-anchor="middle">24 x 5 x 8 mm pads</text>

  <path class="load" d="M925 500 L925 456"/>
  <text class="label" x="925" y="530" text-anchor="middle">payload/contact load</text>
  <path class="load" d="M886 430 C820 430,810 370,790 340"/>
  <path class="load" d="M740 335 C665 352,625 335,585 300"/>
  <path class="load" d="M540 300 C470 350,420 350,377 325"/>
  <path class="load" d="M330 330 C270 365,220 360,185 335"/>
  <path class="load" d="M165 335 L120 335"/>
  <path class="reaction" d="M100 375 L100 420"/>
  <text class="small" x="100" y="445" text-anchor="middle">fixture/robot reaction</text>

  <rect class="tbd" x="40" y="645" width="500" height="210"/>
  <text class="label" x="60" y="674">Joint stack required at J1-J4 / 每个关节所需堆叠</text>
  <text class="small" x="60" y="701">1. Structural shaft with shoulders and documented retention - PN TBD</text>
  <text class="small" x="60" y="724">2. Two separated reaction bearings or justified equivalent - PN/fits TBD</text>
  <text class="small" x="60" y="747">3. Servo horn/hub transfers torque; it does not define the full load path - PN TBD</text>
  <text class="small" x="60" y="770">4. Spacers/shims control endplay without side-loading bearings - dimensions TBD</text>
  <text class="small" x="60" y="793">5. Fasteners, locking, thread engagement and service limits - grades/torques TBD</text>
  <text class="small" x="60" y="816">6. Material, section, tolerance, fatigue and proof-load evidence - all unresolved</text>

  <rect class="tbd" x="565" y="645" width="495" height="210"/>
  <text class="label" x="585" y="674">Release blockers / 放行阻塞项</text>
  <text class="small" x="585" y="701">Gear candidate: module 1 mm, 24/24 teeth,</text>
  <text class="small" x="585" y="720">24 mm center distance, ratio -1.</text>
  <text class="small" x="585" y="743">Unknown: material, pressure angle, face width,</text>
  <text class="small" x="585" y="762">profile shift, backlash, strength and wear.</text>
  <text class="small" x="585" y="785">Unknown: horn, shaft/bearing PNs, fits and retention.</text>
  <text class="small" x="585" y="808">Required: measured inertia and >=3x continuous torque.</text>
  <text class="small" x="585" y="831">Physical release: BLOCKED / 实体放行：阻塞</text>
</svg>
